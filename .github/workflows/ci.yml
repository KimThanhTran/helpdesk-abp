name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (unit, integration, PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # includes the Testcontainers tests, which start a real PostgreSQL (Docker is available on the runner)
      - run: dotnet test backend/Helpdesk.slnx --configuration Release

  sheets-script:
    name: Google Apps Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test integrations/google-sheets/Code.test.js

  frontend:
    name: Web UI tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  mobile:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # pinned: the newest stable release deprecates package:flutter/material.dart (in favour of material_ui), and
          # `flutter analyze` fails on that notice; moving to it is a change of its own, made when this version is left behind
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  end-to-end:
    name: End to end (Docker stack + Google Sheets and mail stand-ins)
    runs-on: ubuntu-latest
    env:
      SHEETS_WEBHOOK_URL: http://sheets-stub:8787/exec
      SHEETS_SECRET: ci-secret
      SHEETS_INCLUDE_TITLE: "true"
      SHEETS_INCLUDE_PEOPLE: "true"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_USE_SSL: "false"
      MAIL_FROM: helpdesk@example.test
      MAIL_INBOUND_SECRET: ci-inbound-secret
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile sheets-demo --profile mail-demo up -d --build
      - run: SHEETS_DUMP_URL=http://localhost:8787/dump MAIL_DUMP_URL=http://localhost:8025 python3 scripts/smoke_test.py http://localhost:8080
      - name: Show container logs when something failed
        if: failure()
        run: docker compose --profile sheets-demo --profile mail-demo logs --no-color --tail=200
      - run: docker compose --profile sheets-demo --profile mail-demo down -v
        if: always()
