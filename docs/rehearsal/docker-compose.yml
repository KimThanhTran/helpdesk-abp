# A local stand-in for the online setup: the API alone on its own address, a plain PostgreSQL,
# no separate migration step (Helpdesk__MigrateOnStartup), and the UI served from a different origin (the "Pages" site).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: Helpdesk
      POSTGRES_USER: neon
      POSTGRES_PASSWORD: rehearsal-pw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neon -d Helpdesk"]
      interval: 3s
      retries: 20

  api:
    build:
      context: ../../backend
      target: api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      # the two settings Render provides; PlatformSettings turns them into the connection string and the addresses
      DATABASE_URL: "postgres://neon:rehearsal-pw@db:5432/Helpdesk"
      RENDER_EXTERNAL_URL: "http://localhost:8090"
      AuthServer__RequireHttpsMetadata: "false"
      AuthServer__SwaggerClientId: "Helpdesk_Demo"
      App__CorsOrigins: "http://localhost:4173"
      Helpdesk__MigrateOnStartup: "true"
      Helpdesk__SeedDemoData: "true"
      Helpdesk__SeedDemoTickets: "true"
